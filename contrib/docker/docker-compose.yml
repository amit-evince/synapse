# Docker Compose for a standalone Synapse install.
# Synapse is exposed on HTTP port 8008 — put a TLS-terminating reverse proxy
# (nginx, Caddy, etc.) in front of it for production use.

version: '3'

services:

  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    # Restart automatically if Synapse crashes (it does not retry DB connections)
    restart: unless-stopped
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    volumes:
      - ./files:/data
    depends_on:
      - db
    ports:
      - 8008:8008/tcp

  db:
    image: docker.io/postgres:15-alpine
    # Change POSTGRES_PASSWORD before going to production!
    environment:
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=changeme
      # Required encoding/collation for Synapse:
      # https://element-hq.github.io/synapse/latest/postgres.html#set-up-database
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - ./schemas:/var/lib/postgresql/data
